---
# Homepage configuration
# See https://fontawesome.com/search for icons options

title: "DevOps Control Centre"
subtitle: "My AWS ECS Project"
logo: "logo.png"

# icon: "fas fa-skull-crossbones" # Optional icon

header: true
footer: '<p>Created with <span class="has-text-danger">❤️</span> with <a href="https://bulma.io/">bulma</a>, <a href="https://vuejs.org/">vuejs</a> & <a href="https://fontawesome.com/">font awesome</a> // Fork me on <a href="https://github.com/bastienwirtz/homer"><i class="fab fa-github-alt"></i></a></p>' # set false if you want to hide it.

# Optional theme customization
theme: default

# Optional theme customization (color overrrides)
# overrrides can also be done using CSS vars 
colors:
  light:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#f5f5f5"
    card-background: "#ffffff"
    text: "#363636"
    text-header: "#ffffff"
    text-title: "#303030"
    text-subtitle: "#424242"
    card-shadow: rgba(0, 0, 0, 0.1)
    link: "#3273dc"
    link-hover: "#363636"
  dark:
    highlight-primary: "#3367d6"
    highlight-secondary: "#4285f4"
    highlight-hover: "#5a95f5"
    background: "#131313"
    card-background: "#2b2b2b"
    text: "#eaeaea"
    text-header: "#ffffff"
    text-title: "#fafafa"
    text-subtitle: "#f5f5f5"
    card-shadow: rgba(0, 0, 0, 0.4)
    link: "#3273dc"
    link-hover: "#ffdd57"

# Optional message
message:
  #url: https://b4bz.io
  style: "is-dark"
  title: "Welcome to my DevOps Dashboard"
  icon: "fas fa-terminal"
  content: "A dashboard for the tools and services used in my AWS ECS DevOps project."

# Optional navbar
# links: [] # Allows for navbar (dark mode, layout, and search) without any links
links:
  - name: "GitHub"
    icon: "fab fa-github"
    url: "https://github.com/P4R5IVAL/homer"
    target: "_blank"

  - name: "AWS Console"
    icon: "fas fa-cloud"
    url: "https://console.aws.amazon.com/"
    target: "_blank"
  # this will link to a second homer page that will load config from additional-page.yml and keep default config values as in config.yml file
  # see url field and assets/additional-page.yml.dist used in this example:
  #- name: "another page!"
  #  icon: "fas fa-file-alt"
  #  url: "#additional-page" 


# Optional: enable periodic refresh for all smart cards that implements it (unless overriden at service configuration level).
updateIntervalMs: 30000 # interval in milliseconds, minimum is 1000 (1s). Remove or set to 0 to disable. Can be overriden at service level. (default disabled)

# Services
# First level array represent a group.
# Leave only a "items" key if not using group (group name, icon & tagstyle are optional, section separation will not be displayed).
services:
  - name: "Cloud Services"
    icon: "fas fa-cloud"
    items:
      - name: "AWS Console"
        icon: "fas fa-cloud"
        subtitle: "Manage my AWS resources"
        url: "https://console.aws.amazon.com/"

      - name: "Amazon ECS"
        icon: "fas fa-server"
        subtitle: "Manage container deployments"
        url: "https://console.aws.amazon.com/ecs/"

      - name: "Amazon ECR"
        icon: "fas fa-box"
        subtitle: "Manage container images"
        url: "https://console.aws.amazon.com/ecr/"

  - name: "DevOps Tools"
    icon: "fas fa-code"
    items:
      - name: "GitHub"
        icon: "fab fa-github"
        subtitle: "Source control and CI/CD"
        url: "https://github.com/P4R5IVAL/homer"

      - name: "Docker"
        icon: "fab fa-docker"
        subtitle: "Containerisation platform"
        url: "https://www.docker.com/"

      - name: "Terraform"
        icon: "fas fa-cubes"
        subtitle: "Infrastructure as Code"
        url: "https://developer.hashicorp.com/terraform"